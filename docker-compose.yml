services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: kamikase-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-kamikase_root_pass}
      MYSQL_DATABASE: ${DB_NAME:-api_kamikase}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-kamikase_root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kamikase-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kamikase-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-kamikase_root_pass}
      DB_NAME: ${DB_NAME:-api_kamikase}
      JWT_SECRET: ${JWT_SECRET:-KamikaseChaveSecretaProducao2026!@#}
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGINS: http://localhost:80,http://localhost:5173,http://localhost
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kamikase-network

  # Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: kamikase-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - kamikase-network

volumes:
  mysql_data:

networks:
  kamikase-network:
    driver: bridge
